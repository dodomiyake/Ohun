services:
  mongo:
    image: mongo:7.0
    command: [mongod, --replSet, rs0, --bind_ip_all]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - ohun-local-mongo:/data/db
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "db.adminCommand({ping:1})"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  ohun-local-mongo:
